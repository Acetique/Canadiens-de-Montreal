
name: Actualiser CH LIVE

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ch-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Télécharger les données LNH
        run: python scripts/update_data.py

      - name: Publier les JSON actualisés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique des données LNH"
            git push
          else
            echo "Aucune nouvelle donnée à publier."
          fi
