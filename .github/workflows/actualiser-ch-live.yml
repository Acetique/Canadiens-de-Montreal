
name: Actualiser CH LIVE

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ch-live-data
  cancel-in-progress: false

jobs:
  update:
    name: Actualisation des données LNH
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt GitHub
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifier Python
        run: |
          python --version

      - name: Télécharger les données LNH
        run: |
          python scripts/update_data.py

      - name: Vérifier les fichiers JSON
        run: |
          echo "Fichiers présents dans data :"
          ls -lah data/

      - name: Publier les données actualisées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique des données LNH"
            git push
            echo "Données LNH publiées avec succès."
          else
            echo "Aucune modification détectée."
          fi
